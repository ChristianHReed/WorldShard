name: Fetch MegaKit assets

# One-off helper: downloads the Quaternius Stylized Nature MegaKit (CC0)
# and puts its glTF files on the `assets-megakit` branch so they can be
# picked and added to the game.
on:
  push:
    branches: [fetch-assets]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/kit /tmp/out
          cd /tmp/kit
          curl -sSfL -o kit.zip "https://opengameart.org/sites/default/files/stylized_nature_megakitstandard.zip" || \
            curl -sSfL -o kit.zip "https://opengameart.org/sites/default/files/stylized_nature_megakit_standard.zip"
          ls -la kit.zip
          unzip -l kit.zip > /tmp/out/listing.txt
          unzip -q kit.zip -d x
          cd x
          find . -type f \( -iname '*.gltf' -o -iname '*.glb' -o -iname '*.bin' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.txt' -o -iname '*.md' \) \
            -not -path '*/FBX/*' -not -path '*/OBJ/*' -print0 | xargs -0 -I{} cp --parents {} /tmp/out/
          du -sh /tmp/out
          find /tmp/out -type f | head -400 > /tmp/out/files.txt

      - name: Push to the assets-megakit branch
        shell: bash
        run: |
          cd /tmp/out
          git init -q && git checkout -q -b assets-megakit
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Quaternius Stylized Nature MegaKit (Standard, CC0): glTF files"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" assets-megakit
