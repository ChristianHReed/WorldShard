name: Web build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write # to publish build logs to the ci-logs branch
  actions: write # to ask the Publish site workflow to publish

# A newer push cancels the older build on the same branch or pull request.
# (A merged pull request's "closed" event carries main's ref, so it gets a
# group of its own: it must never cancel the build of main.)
concurrency:
  group: web-${{ github.event.action == 'closed' && format('closed-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with the wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            game -> target

      - name: Test the world library
        shell: bash
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test.log

      - name: Build the game for the web
        shell: bash
        working-directory: game
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: |
          set -o pipefail
          # two builds: WebGL 2 (works everywhere) and WebGPU (the page picks it
          # when the browser has WebGPU)
          cargo build --release --target wasm32-unknown-unknown 2>&1 | tee ../build.log
          cp target/wasm32-unknown-unknown/release/worldshard-game.wasm /tmp/ws-webgl.wasm
          cargo build --release --target wasm32-unknown-unknown --no-default-features --features webgpu 2>&1 | tee -a ../build.log
          cp target/wasm32-unknown-unknown/release/worldshard-game.wasm /tmp/ws-webgpu.wasm

      - name: Install wasm-bindgen (same version as the game uses)
        shell: bash
        run: |
          V=$(cargo metadata --format-version 1 --manifest-path game/Cargo.toml | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          echo "wasm-bindgen $V"
          cargo install wasm-bindgen-cli --version "$V" --locked

      - name: Package the site
        shell: bash
        run: |
          set -e
          mkdir -p dist/prototype
          wasm-bindgen --target web --no-typescript --out-dir dist --out-name worldshard /tmp/ws-webgl.wasm
          wasm-bindgen --target web --no-typescript --out-dir dist --out-name worldshard_webgpu /tmp/ws-webgpu.wasm
          # shrink the downloads with wasm-opt (skipped if it is unavailable)
          if curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz -C /tmp; then
            for w in dist/worldshard_bg.wasm dist/worldshard_webgpu_bg.wasm; do
              before=$(stat -c %s "$w")
              /tmp/binaryen-version_123/bin/wasm-opt -Oz \
                --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext \
                --enable-mutable-globals --enable-reference-types --enable-multivalue \
                "$w" -o /tmp/opt.wasm && mv /tmp/opt.wasm "$w" \
                || echo "wasm-opt failed; keeping the unoptimised $w"
              echo "$w: $before -> $(stat -c %s "$w") bytes" | tee -a build.log
            done
          fi
          for w in dist/worldshard_bg.wasm dist/worldshard_webgpu_bg.wasm; do
            gzip -9 -c "$w" | wc -c | xargs echo "gzipped $w bytes:" | tee -a build.log
          done
          # split the game into pieces under 15 MB (fits hosts with file-size limits,
          # such as a Claude artifact); the page joins them back together
          (cd dist && split -b 15000000 -d -a 1 --additional-suffix=.wasm worldshard_bg.wasm worldshard_bg.part \
            && python3 -c "import json,os,glob; print(json.dumps([{'file':f,'size':os.path.getsize(f)} for f in sorted(glob.glob('worldshard_bg.part*.wasm'))]))" > wasm-parts.json \
            && cat wasm-parts.json)
          cp game/web/index.html dist/index.html
          cp game/web/manifest.webmanifest dist/ && cp -r game/web/icons dist/icons # Home Screen app
          # the build, for problem reports: a commit, or "pr<number>-<commit>" for a preview
          B="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            B="pr${{ github.event.number }}-$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)"
          fi
          sed -i "s/__BUILD__/$B/" dist/index.html
          cp -r game/assets dist/assets
          cp web-prototype/index.html dist/prototype/index.html
          # Two Halls, a separate small game, at .../two-halls/
          mkdir -p dist/two-halls
          cp two-halls/index.html two-halls/manifest.webmanifest two-halls/sw.js two-halls/icon.png two-halls/icon-180.png dist/two-halls/
          touch dist/.nojekyll
          ls -la dist | tee -a build.log

      - name: Keep the site for publishing
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 90
          include-hidden-files: true

      # Publishing runs in its own workflow (pages.yml, from main), so a pull
      # request can get a preview link without waiting for the smoke test:
      # main -> the live game; a pull request -> .../WorldShard/pr/<number>/
      - name: Publish it (main → the live game; a pull request → its preview link)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ github.event_name }} ${{ github.head_ref || github.ref_name }}
        run: |
          gh workflow run pages.yml --ref main -R "${{ github.repository }}" -f why="$WHY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Preview, in a few minutes: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke test in headless Chrome
        continue-on-error: true
        shell: bash
        run: |
          (cd dist && python3 -m http.server 8080 >/dev/null 2>&1 &)
          mkdir -p /tmp/smoke-tool && cd /tmp/smoke-tool && npm init -y >/dev/null && npm install --silent puppeteer-core@24
          cp "$GITHUB_WORKSPACE/tools/smoke-test.mjs" /tmp/smoke-tool/
          timeout 5400 node /tmp/smoke-tool/smoke-test.mjs http://localhost:8080/ "$GITHUB_WORKSPACE/smoke"

      - name: Publish build logs (ci-logs branch)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp build.log test.log /tmp/logs/ 2>/dev/null || true
          cp -r smoke /tmp/logs/ 2>/dev/null || true
          cp -r dist /tmp/logs/site 2>/dev/null || true
          cd /tmp/logs
          echo "${{ github.sha }} ${{ job.status }}" > run.txt
          git init -q && git checkout -q -b ci-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Build logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

  # a closed pull request: nothing to build. When this run finishes, the
  # Publish site workflow runs again and leaves the closed preview out.
  closed:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pull request closed; its preview comes down at the next publish."
