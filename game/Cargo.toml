[package]
name = "worldshard-game"
version = "0.1.0"
edition = "2021"
description = "WorldShard, the playable game (Bevy). Builds for the web (wasm) and desktop."
publish = false

# Its own workspace, so the world library at the repo root still builds and
# tests offline without downloading Bevy.
[workspace]

[dependencies]
worldshard = { path = ".." }
# Only the parts of Bevy the game uses (no audio, animation, picking...)
# to keep the web download small.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "bevy_gltf",
    "bevy_image",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_shader",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "web",
    "x11",
] }

[features]
default = ["webgl2"]
# The graphics system on the web, one per build: WebGL 2 works everywhere;
# WebGPU (newer browsers) prepares shaders without freezing the page. The
# web page loads the WebGPU build when the browser has WebGPU.
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
# random numbers in the browser (both getrandom generations used by Bevy's deps)
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"     # engine code: small download
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.release.package.worldshard]
opt-level = 3       # world generator and meshes: fast start-up

# keep desktop debug builds playable
[profile.dev.package."*"]
opt-level = 2
