[package]
name = "worldshard-game"
version = "0.1.0"
edition = "2021"
description = "WorldShard, the playable game (Bevy). Builds for the web (wasm) and desktop."
publish = false

# Its own workspace, so the world library at the repo root still builds and
# tests offline without downloading Bevy.
[workspace]

[dependencies]
worldshard = { path = ".." }
bevy = { version = "0.16", features = ["webgl2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element"] }
js-sys = "0.3"
# random numbers in the browser (both getrandom generations used by Bevy's deps)
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = "thin"

# keep desktop debug builds playable
[profile.dev.package."*"]
opt-level = 2
